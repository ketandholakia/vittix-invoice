name: vittix_invoice
description: "Vittix Invoice — GST invoicing, quotes, reminders and Nextcloud/Drive backup."
publish_to: 'none'

version: 0.9.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.1

  # Database
  drift: ^2.31.0
  sqlite3: ^3.3.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # PDF
  pdf: ^3.11.0
  printing: ^5.13.1

  # Navigation
  go_router: ^14.2.0

  # Utils
  crypto: ^3.0.3
  share_plus: ^12.0.2
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  image_picker: ^1.1.2
  flutter_colorpicker: ^1.1.0
  flutter_local_notifications: ^22.0.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  file_selector: ^1.0.3
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  http: ^1.6.0
  fl_chart: ^0.68.0
  xml: ^7.0.1
  flutter_secure_storage: ^10.3.1
  local_auth: ^2.3.0
  pointycastle: ^3.9.1

  # Localization generated sources live under /lib/l10n.
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.4.11
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true
  generate: true

  # Bundled PDF fonts (Latin + Devanagari + Gujarati) so the rupee sign and
  # Indic names render offline.
  assets:
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#3730A3"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#3730A3"
  android_12:
    color: "#3730A3"
